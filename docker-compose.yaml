name: kubstu-docs

# Copy .env.template → .env and fill in the values, then:
#   docker compose up --build

services:
  frontend:
    build: ./frontend
    container_name: frontend-1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app

  app:
    build: ./backend
    container_name: app-1
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python manage.py migrate &&
        celery -A config.celery worker -E --loglevel=info --hostname=worker.basic --concurrency=3 &
        celery -A config.celery beat --loglevel=info &
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "

  db:
    image: postgres:16-alpine
    container_name: db-1
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-1
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
